<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김프 터미널</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="src/terminal.css" />
</head>

<body>
  <div class="terminal">

    <header class="bar">
      <select name="exchangeChoice" class="exchangeChoice" aria-label="국내 거래소" onchange="settingCoin()">
        <option value="BITHUMB" selected>빗썸</option>
        <option value="UPBIT">업비트</option>
      </select>
      <select name="coinChoice" class="coinChoice" aria-label="종목" onchange="settingCoin()">
        <option value="BTC" selected>비트코인</option>
        <option value="XRP">리플</option>
        <option value="ETH">이더리움</option>
      </select>
      <span class="lev-pre">레버리지 &times;</span>
      <select name="leverageChoice" class="leverageChoice" aria-label="레버리지" onchange="settingCoin()">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
      <span class="status"><span class="dot"></span>LIVE</span>
    </header>

    <section class="hero">
      <div class="hero-head">
        <span class="eyebrow k">김프</span>
        <span class="eyebrow">현김프 &middot; 매수김프</span>
      </div>
      <div class="hero-row">
        <p id="currentSellPremium" class="premium_value hero-figure"></p>
        <span class="hero-delta">
          <span class="k">차이</span>
          <p id="benefitPremium" class="benefitPremium_value"></p>
        </span>
      </div>
    </section>

    <section class="strip">
      <div class="cell accent">
        <span class="eyebrow k">총 자산</span>
        <p id="totalValue" class="v">0</p>
      </div>
      <div class="cell accent">
        <span class="eyebrow k">합산 손익</span>
        <p id="benefitValue" class="v">0</p>
      </div>
      <div class="cell">
        <span class="eyebrow k">환율 &middot; USDT</span>
        <p id="exchangeValue" class="v">0</p>
      </div>
    </section>

    <section class="ledger">

      <div class="book">
        <div class="book-head">
          <span class="venue">국내 거래소</span>
          <span class="sym">KRW</span>
          <span class="upbitTimer timer">0</span>
        </div>
        <p id="upbitPrice" class="price">0</p>
        <div class="pnl">
          <span class="upbitBenefit benefit">0</span>
        </div>
        <div class="valuation">
          <span class="eyebrow">현물 평가액</span>
          <span id="upbitValue" class="v">0</span>
        </div>
        <ul class="fields">
          <li>
            <p>코인 개수</p>
            <input id="upbitInput" type="number" value="10" />
          </li>
          <li>
            <p>매수 평단</p>
            <input id="sellUpbitInput" type="number" value="0" />
          </li>
          <li>
            <p id="upbitDregsTitle">잔여 금액</p>
            <input id="upbitDregsInput" type="number" value="0" />
          </li>
        </ul>
      </div>

      <div class="book">
        <div class="book-head">
          <span class="venue">바이낸스 선물</span>
          <span class="sym">USDT</span>
          <span class="binanceTimer timer">0</span>
        </div>
        <p id="binancePrice" class="price">0</p>
        <div class="pnl">
          <span class="binanceBenefitKRW benefit">0</span>
          <span class="binanceBenefit benefit">0</span>
        </div>
        <div class="valuation">
          <span class="eyebrow">증거금 + 손익</span>
          <span id="binanceValue" class="v">0</span>
        </div>
        <ul class="fields">
          <li>
            <p>코인 개수</p>
            <input id="binanceInput" type="number" />
          </li>
          <li>
            <p>매수 평단</p>
            <input id="sellBinanceInput" type="number" value="0" />
          </li>
          <li>
            <p id="binanceDregsTitle">잔여 금액</p>
            <input id="binanceDregsInput" type="number" value="0" />
          </li>
        </ul>
      </div>

    </section>
  </div>

  <script src="src/index.js"></script>
</body>

</html>
